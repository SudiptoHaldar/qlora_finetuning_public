# Local development environment: what scripts/env_check.py compares this machine against
# (req_000 v0.03). Nothing here is a secret.
version: 1
verified_on: "2026-11-15"

python_min: "3.11"                 # keep quoted: unquoted 3.10 would load as 3.1
pins_file: requirements-train.txt  # relative to the repository root

torch:
  cuda_build: cu126                # suffix of the installed torch version, e.g. 2.14.1+cu126
  install_index: https://download.pytorch.org/whl/cu126

gpu:
  min_vram_gib: 15                 # a "16 GB" card reports just under 16 GiB
  bf16_min_compute_capability: 8.0 # older cards (7.5) must use FP16

# The opt-in smoke step (env_check --smoke): load a small model in 4-bit, attach LoRA, run one
# training step. The LoRA and quantization values are the plan's Path A defaults (plan 4.6).
smoke:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  max_seq_length: 1024             # the smoke example with the full system text is 473 tokens
  max_new_tokens: 16
  learning_rate: 2.0e-4
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
  quantization:
    type: nf4
    double_quant: true
    compute_dtype: bfloat16
